[package]
name = "howtui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "AI-powered terminal command assistant with an inline TUI"
license = "MIT"
repository = "https://github.com/hungryZoo/howtui"
readme = "README.md"
keywords = ["cli", "tui", "shell", "llm", "terminal"]
categories = ["command-line-utilities"]

[features]
default = []
# 테스트 전용 Mock Provider와 테스트 엔드포인트 재정의 (릴리스 빌드 제외)
mock-provider = []

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "string"] }
crossterm = { version = "0.29", features = ["bracketed-paste"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
httparse = "1"
keyring = "4.2"
open = "5.4"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy", "json", "stream"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS kqueue는 /dev/tty 폴링 미지원: stdin 파이프 시 select 기반 이벤트 소스 사용
[target.'cfg(target_os = "macos")'.dependencies]
crossterm = { version = "0.29", features = ["bracketed-paste", "use-dev-tty"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[dev-dependencies]
assert_cmd = "2.2"
insta = "1.49"
tempfile = "3.27"
wiremock = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "unwind"
