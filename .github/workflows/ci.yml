# CI (SRS 13.4절): 형식, 정적 분석, 테스트, 교차 빌드와 glibc 하한, 추적성과 소스 규칙 검사
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c rustfmt -c clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features mock-provider -- -D warnings
      - name: Source rules
        run: scripts/ci/check_rules.sh
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Traceability
        run: |
          uv run scripts/trace_check.py
          git diff --exit-code docs/TRACEABILITY.md

  # 의존성 취약점 검사 (TC-NFR-008): RustSec 공지 대상 Cargo.lock 검사
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --features mock-provider
      - run: cargo build --locked --release

  armv7-glibc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" armv7-unknown-linux-gnueabihf aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Install cargo-zigbuild and zig (pinned)
        run: |
          uv venv "$RUNNER_TEMP/zig"
          uv pip install --python "$RUNNER_TEMP/zig/bin/python" cargo-zigbuild==0.23.4 ziglang==0.17.0
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Linux targets with glibc 2.17 floor
        run: |
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf; do
            cargo zigbuild --locked --release --target "$t.2.17"
          done
      - name: Check glibc floor and architecture
        run: scripts/ci/check_binaries.sh

  pty:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q tmux zsh; else brew install tmux; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --features mock-provider
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: No cursor reply terminal
        run: uv run tests/pty/no_dsr.py target/debug/howtui
      - name: PTY E2E
        run: tests/pty/run.sh
        env:
          PTY_LANG: ${{ runner.os == 'macOS' && 'en_US.UTF-8' || 'C.UTF-8' }}
      # 쉘 통합 (SRS 9절): 각 쉘에서 init 등록 후 단축키, 다음 입력 전달, 캡처, 취소, 대체 경로
      - name: Shell integration E2E (Bash)
        run: bash --version | head -1 && tests/pty/shell.sh bash
        env:
          PTY_LANG: ${{ runner.os == 'macOS' && 'en_US.UTF-8' || 'C.UTF-8' }}
      - name: Shell integration E2E (macOS Bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash --version | head -1 && tests/pty/shell.sh bash
        env:
          PTY_LANG: en_US.UTF-8
          PTY_SHELL_BIN: /bin/bash
      - name: Shell integration E2E (Zsh)
        run: zsh --version && tests/pty/shell.sh zsh
        env:
          PTY_LANG: ${{ runner.os == 'macOS' && 'en_US.UTF-8' || 'C.UTF-8' }}
      - name: Shell integration E2E (PowerShell)
        run: pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString(); (Get-Module -ListAvailable PSReadLine | Select-Object -First 1).Version.ToString()' && tests/pty/shell.sh powershell
        env:
          PTY_LANG: ${{ runner.os == 'macOS' && 'en_US.UTF-8' || 'C.UTF-8' }}
      - name: Upload PTY logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pty-logs-${{ matrix.os }}
          path: logs/

  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
          - os: macos-15
            shell: bash
          - os: windows-2025
            shell: powershell
          - os: windows-2025
            shell: pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        shell: bash
        run: cargo build --locked --release
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh -n scripts/install.sh
          tests/install/detect.sh
          tests/install/run_unix.sh target/release/howtui
      - name: install.ps1
        if: runner.os == 'Windows'
        run: tests/install/run_windows.ps1 -Exe target\release\howtui.exe
